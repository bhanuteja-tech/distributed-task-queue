[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distributed-task-queue"
version = "0.1.0"
description = "A fault-tolerant, modular distributed task queue system built with FastAPI, RabbitMQ, PostgreSQL, and Redis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<2.11.0",
    "pydantic-settings>=2.5.0,<2.7.0",
    "sqlalchemy>=2.0.35,<2.1.0",
    "asyncpg>=0.29.0,<0.31.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "alembic>=1.13.3,<1.14.0",
    "aio-pika>=9.4.3,<9.6.0",
    "redis>=5.1.0,<5.3.0",
    "prometheus-client>=0.21.0,<0.22.0",
    "httpx>=0.27.2,<0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "ruff>=0.7.0,<0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskqueue"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
